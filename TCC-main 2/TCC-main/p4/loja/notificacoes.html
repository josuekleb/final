<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendly — Notificações</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <link rel="stylesheet" href="../css/p4-theme.css" />
    <script src="../js/p4-interactions.js" defer></script>
    <script src="../js/appointment-actions.js" defer></script>
  </head>
  <body class="notification-body">
    <header class="notification-topbar">
      <div class="notification-brand-wrap">
        <div class="notification-logo-mark" aria-label="Agendly logo">
          <img src="../img/Design%20sem%20nome%201.png" alt="Agendly" />
        </div>
        <span class="notification-brand-text">Agendly</span>
      </div>

      <nav class="notification-nav" aria-label="Navegação principal">
        <a class="notification-nav-item" href="indexloja.html">Editor da Página</a>
        <a class="notification-nav-item" href="agendaloja.html">Agendamentos</a>
      </nav>

      <div class="notification-user-area">
        <button
          class="notification-bell"
          type="button"
          aria-label="Notificações"
        >
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path
              d="M12 3a5 5 0 0 1 5 5v3.5l1.8 3.5H5.2L7 11.5V8a5 5 0 0 1 5-5zm0 18a2.5 2.5 0 0 1-2.45-2h4.9A2.5 2.5 0 0 1 12 21z"
              fill="currentColor"
            />
          </svg>
        </button>
        <div class="notification-user-badge">
          <span>BS</span>
        </div>
        <span class="notification-shop-name">Barbearia Silva Pro</span>
      </div>
    </header>

    <main class="notification-main" role="main">
      <section class="notification-panel" aria-label="Lista de notificações">
        <div class="notification-header-row">
          <div class="notification-title-wrap">
            <a class="notification-back" href="indexloja.html" aria-label="Voltar ao painel da loja">
              ←
            </a>
            <h1>Notificações</h1>
          </div>

          <button class="notification-mark-all" type="button">
            ✓ Marcar todas como lidas
          </button>
        </div>

        <div class="notification-tabs" aria-label="Tipos de notificações">
          <button class="tab active" type="button">Todas (5)</button>
          <button class="tab" type="button">Novos Agendamentos (4)</button>
          <button class="tab" type="button">Cancelamentos (1)</button>
          <button class="tab" type="button">Pendentes</button>
        </div>










      </section>

      <div class="notification-footer-note">
        Você visualizou todos os seus agendamentos das últimas 24 horas.
      </div>

      <button class="floating-scroll" type="button" aria-label="Ir para o topo">
        ↓
      </button>
    </main>
    <script src="../js/dev-mode.js" defer></script>
      <footer class="p4-consistent-footer"><a href="../index.html">Agendly<span>.</span></a><span>Mais tempo para viver o que importa.</span><nav aria-label="Links de rodapé"><a href="../cliente/Termos%20de%20Uso.html">Termos</a><a href="../cliente/duvidas.html">Ajuda</a><a href="../cliente/contato%20suporte.html">Contato</a></nav><small>© 2026 Agendly · Seu tempo, do seu jeito.</small></footer>
  </body>
</html>
