<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agendly — Recuperar Senha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #edf3f8;
        --panel: #f5f7fa;
        --white: #fff;
        --line: #dfe8f3;
        --text: #1d2d40;
        --muted: #6f7d91;
        --primary: #1e7af6;
        --primary-dark: #1d5fd4;
        --input-border: #2a7fea;
        --shadow: rgba(29, 45, 64, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      html, body {
        margin: 0;
        height: 100%;
        font-family: "Poppins", sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
      }

      a {
        text-decoration: none;
      }

      .topbar {
        height: 86px;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0 28px 0 26px;
        border-bottom: 1px solid rgba(134, 153, 180, 0.25);
        background: rgba(255, 255, 255, 0.08);
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 180px;
      }

      .brand-mark {
        width: 42px;
        height: 42px;
        border-radius: 12px;
        overflow: hidden;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
      }

      .brand-mark img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        display: block;
        filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.08));
      }

      .brand-name {
        font-weight: 700;
        font-size: 2.1rem;
        line-height: 1;
        letter-spacing: -0.08em;
        color: #1b2d40;
      }

      .brand-name span {
        color: var(--primary);
      }

      .topbar-links {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--primary);
        font-size: 1.05rem;
        font-weight: 500;
      }

      .topbar-links strong {
        font-weight: 600;
        color: var(--primary-dark);
      }

      .main-area {
        flex: 1;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: flex-start;
        padding-top: 72px;
      }

      .return-link {
        position: absolute;
        left: 26px;
        top: 34px;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: #21476d;
        font-size: 1.05rem;
        font-weight: 600;
      }

      .return-link .arrow-box {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(30, 122, 246, 0.08);
        color: var(--primary-dark);
        font-size: 1.1rem;
      }

      .panel {
        width: 470px;
        min-height: 440px;
        background: rgba(247, 249, 252, 0.9);
        border: 1px solid rgba(129, 149, 176, 0.25);
        border-radius: 24px;
        box-shadow: 0 12px 28px rgba(18, 40, 80, 0.05);
        padding: 28px 24px 22px;
        position: relative;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.1rem, 2.1vw, 3rem);
        line-height: 1.2;
        font-weight: 700;
        letter-spacing: -0.05em;
        text-align: center;
      }

      .subtitle {
        margin: 18px auto 22px;
        width: 100%;
        max-width: 360px;
        color: #6c7c90;
        font-size: 1rem;
        line-height: 1.45;
        text-align: center;
      }

      .option-list {
        display: flex;
        flex-direction: column;
        gap: 14px;
        margin-top: 8px;
      }

      .option {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 68px;
        padding: 12px 16px;
        background: rgba(255,255,255,0.46);
        border: 2px solid rgba(135, 153, 177, 0.5);
        border-radius: 16px;
        cursor: pointer;
        transition: border-color 0.2s ease, box-shadow 0.2s ease;
      }

      .option:hover {
        border-color: rgba(30, 122, 246, 0.7);
      }

      .option input {
        display: none;
      }

      .option-left {
        display: flex;
        align-items: center;
        gap: 12px;
        min-width: 0;
      }

      .icon-box {
        width: 28px;
        height: 28px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        color: var(--primary);
        flex-shrink: 0;
      }

      .option-title {
        font-size: 1.12rem;
        font-weight: 500;
        color: var(--text);
        line-height: 1.25;
      }

      .option-meta {
        display: block;
        color: #7b8695;
        font-size: 0.9rem;
        line-height: 1.2;
      }

      .option-toggle {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(34, 61, 89, 0.5);
        background: transparent;
      }

      .option.selected {
        border-color: var(--input-border);
      }

      .option.selected .option-toggle {
        border-color: var(--primary);
        position: relative;
      }

      .option.selected .option-toggle::after {
        content: "";
        position: absolute;
        inset: 4px;
        border-radius: 50%;
        background: var(--primary);
      }

      .submit-btn {
        width: 100%;
        margin-top: 20px;
        border: none;
        border-radius: 14px;
        background: linear-gradient(90deg, var(--primary), var(--primary-dark));
        color: #fff;
        font-size: 1.12rem;
        font-weight: 700;
        padding: 18px 20px;
        cursor: pointer;
        box-shadow: 0 10px 18px rgba(30, 122, 246, 0.18);
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .submit-btn .arrow {
        font-size: 1.5rem;
        line-height: 1;
        transform: translateY(-1px);
      }

      .footer {
        width: 100%;
        min-height: 74px;
        border-top: 1px solid rgba(133, 152, 177, 0.25);
        background: rgba(255, 255, 255, 0.18);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        padding: 16px 28px 18px;
        color: #7d88a1;
        font-size: 0.82rem;
      }

      .footer nav {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .footer a {
        color: #586a84;
      }

      @media (max-width: 620px) {
        .topbar {
          padding: 0 16px;
        }

        .brand-name {
          font-size: 1.6rem;
        }

        .topbar-links {
          font-size: 0.86rem;
        }

        .main-area {
          padding-top: 54px;
          padding-left: 12px;
          padding-right: 12px;
        }

        .return-link {
          display: none;
        }

        .panel {
          width: 100%;
          max-width: 440px;
          min-height: 0;
          padding: 22px 16px 18px;
        }

        .option {
          padding: 12px 12px;
        }

        .option-title {
          font-size: 1rem;
        }

        .footer {
          flex-direction: column;
          justify-content: center;
          text-align: center;
          padding-top: 14px;
          padding-bottom: 16px;
        }
      }
    </style>
  </head>
  <body>
    <header class="topbar" aria-label="Cabeçalho da página">
      <div class="brand" aria-label="Agendly logo">
        <div class="brand-mark" aria-hidden="true">
          <img src="img/Design%20sem%20nome%201.png" alt="Logo Agendly" />
        </div>
        <div class="brand-name">Agend<span>ly</span></div>
      </div>

      <div class="topbar-links">
        <span>Precisa de ajuda?</span>
        <strong>Central de Suporte</strong>
      </div>
    </header>

    <main class="main-area">
      <a href="cliente/logincliente.html" class="return-link" aria-label="Voltar para o login">
        <span class="arrow-box">←</span>
        <span>Voltar</span>
      </a>

      <section class="panel" aria-labelledby="titulo-recuperar-senha">
        <h1 id="titulo-recuperar-senha">Recuperar Senha</h1>

        <p class="subtitle">
          Escolha o canal de sua preferência para receber o código de verificação temporário
        </p>

        <div class="option-list" role="radiogroup" aria-label="Canais de recuperação">
          <label class="option selected" aria-label="Enviar por e-mail">
            <input type="radio" name="recovery-channel" value="email" checked />
            <div class="option-left">
              <span class="icon-box" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="2.5" y="5.5" width="19" height="13" rx="2.5" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M4 7L12 13L20 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </span>
              <div>
                <span class="option-title">Enviar por E-mail</span>
                <span class="option-meta">c***@empresa.com.br</span>
              </div>
            </div>
            <span class="option-toggle" aria-hidden="true"></span>
          </label>

          <label class="option" aria-label="Enviar por SMS ou WhatsApp">
            <input type="radio" name="recovery-channel" value="sms" />
            <div class="option-left">
              <span class="icon-box" aria-hidden="true">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <rect x="4" y="3.5" width="16" height="17" rx="3" stroke="currentColor" stroke-width="1.8"/>
                  <path d="M8 8H16M8 12H16M8 16H12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
              </span>
              <div>
                <span class="option-title">Enviar por SMS / WhatsApp</span>
                <span class="option-meta">(11) 9****-0000</span>
              </div>
            </div>
            <span class="option-toggle" aria-hidden="true"></span>
          </label>
        </div>

        <button class="submit-btn" type="button">
          <span>Enviar Código</span>
          <span class="arrow">→</span>
        </button>
      </section>
    </main>

    <footer class="footer">
      <div>© 2026 Agendly Soluções de Agendamento S.A. Todos os direitos reservados.</div>

      <nav aria-label="Links do rodapé">
        <a href="#">Termos de Uso</a>
        <a href="#">Privacidade</a>
      </nav>
    </footer>

    <script>
      const options = document.querySelectorAll('.option');

      options.forEach((option) => {
        option.addEventListener('click', () => {
          options.forEach((item) => {
            const input = item.querySelector('input[type="radio"]');
            const isSelected = item === option;
            item.classList.toggle('selected', isSelected);
            if (input) input.checked = isSelected;
          });
        });
      });
    </script>
    <script src="js/dev-mode.js" defer></script>
  </body>
</html>
