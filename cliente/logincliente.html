<!doctype html>
<!--
  Agendly - Login do Cliente
  Arquivo organizado com seções comentadas para facilitar leitura.
-->
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Agendly — Login Cliente</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/styles.css" />
  </head>
  <body>
    <a class="help-link" href="#"
      >Precisa de ajuda? <strong>Central de Suporte</strong></a
    >

    <main class="page" role="main">
      <section class="card" aria-labelledby="login-title">
        <a class="back" href="../login.html" aria-label="Voltar">←</a>

        <div class="logo-wrap">
          <div class="logo-circle">
            <img
              src="../img/Design%20sem%20nome%201.png"
              alt="Agendly"
              class="brand-img"
            />
          </div>
        </div>

        <h1 id="login-title" class="brand">Agendly</h1>
        <p class="lead">
          Login do Cliente<br /><span class="muted"
            >Acesse sua conta de cliente para agendar e gerenciar seus
            serviços</span
          >
        </p>

        <form class="login-form" action="#" method="get" novalidate>
          <label class="field-label">E-MAIL</label>
          <div class="form-field">
            <span class="field-icon" aria-hidden>
              <svg
                width="18"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="3"
                  y="6"
                  width="18"
                  height="12"
                  rx="2"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                  fill="none"
                />
                <path
                  d="M3 8.5l9 6 9-6"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  fill="none"
                />
              </svg>
            </span>
            <input
              class="input"
              type="email"
              name="email"
              autocomplete="email"
              inputmode="email"
              required
              placeholder="seuemail@exemplo.com"
            />
          </div>

          <label class="field-label">SENHA</label>
          <div class="form-field">
            <span class="field-icon" aria-hidden>
              <svg
                width="16"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <rect
                  x="3"
                  y="11"
                  width="18"
                  height="10"
                  rx="2"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                />
                <path
                  d="M7 11V8a5 5 0 0 1 10 0v3"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </span>
            <input
              class="input"
              type="password"
              name="password"
              autocomplete="current-password"
              required
              minlength="8"
              placeholder="●●●●●●●●"
            />
            <button type="button" class="eye" aria-label="Mostrar senha">
              <svg
                class="eye-open"
                width="20"
                height="14"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg"
              >
                <path
                  d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
                <circle
                  cx="12"
                  cy="12"
                  r="3"
                  stroke="#7b8aa3"
                  stroke-width="1.2"
                />
              </svg>
            </button>
          </div>

          <div class="forgot">
            Esqueceu a senha? <a href="../recuperarsenha.html">Clique Aqui</a>
          </div>

          <button class="btn primary enter" type="submit">
            <span class="icon">
              <img src="../img/Design%20sem%20nome%201.png" alt="Agendly" />
            </span>
            <span class="label">Entrar</span><span class="chev">→</span>
          </button>

          <div class="divider"></div>
          <div class="register">
            Não possui uma conta? <a href="../cadastro.html">Cadastre-se</a>
          </div>
        </form>
      </section>
    </main>

    <footer class="site-footer">
      © 2026 Agendly Soluções de Agendamento. Todos os direitos reservados.
    </footer>
  </body>
  <script src="../js/app.js" defer></script>
  <script src="../js/dev-mode.js" defer></script>
</html>
