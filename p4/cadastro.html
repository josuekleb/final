<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a2144" />
    <title>Agendly — Criar conta</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/p4-theme.css" />
    <script src="js/p4-interactions.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body class="auth-page">
    <main class="page" role="main">
      <section class="card" aria-labelledby="register-title">
        <a class="back" href="login.html" aria-label="Voltar">←</a>
        <h1 id="register-title" class="brand">Crie sua conta Agendly</h1>
        <p class="lead">Escolha como você quer usar a plataforma.</p>

        <div class="actions">
          <a class="btn primary" href="cliente/cadastrocliente.html">
            <span class="label login-choice-label">
              <span class="login-choice-kicker">Para uso pessoal</span>
              <span class="login-choice-title">Criar conta de cliente</span>
            </span>
            <span class="chev">›</span>
          </a>
          <a class="btn secondary" href="loja/cadastroloja.html">
            <span class="label login-choice-label">
              <span class="login-choice-kicker">Para profissionais e empresas</span>
              <span class="login-choice-title">Cadastrar meu negócio</span>
            </span>
            <span class="chev">›</span>
          </a>
        </div>

        <div class="register" style="text-align: center">
          Já possui uma conta? <a href="login.html">Fazer login</a>
        </div>
      </section>
    </main>
    <footer class="site-footer">© 2026 Agendly. Todos os direitos reservados.</footer>
    <script src="js/dev-mode.js" defer></script>
  </body>
</html>
