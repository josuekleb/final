<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agendly — Nova senha</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/p4-theme.css" />
  </head>
  <body>
    <main class="page" role="main" style="max-width:560px;margin:auto;padding:48px 24px">
      <a href="cliente/logincliente.html">← Voltar ao login</a>
      <h1 style="font-family:'Playfair Display',Georgia,serif">Crie uma nova senha</h1>
      <p>O link de redefinição expira após 30 minutos e só pode ser usado uma vez.</p>
      <form id="reset-form">
        <label for="new-password">Nova senha</label>
        <input id="new-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        <label for="confirm-password">Confirme a nova senha</label>
        <input id="confirm-password" type="password" minlength="8" maxlength="72" autocomplete="new-password" required />
        <button class="primary-btn" type="submit" style="margin-top:18px">Salvar nova senha</button>
        <p id="reset-status" role="status" aria-live="polite"></p>
      </form>
    </main>
    <footer class="p4-consistent-footer"><a href="index.html">Agendly<span>.</span></a><span>Mais tempo para viver o que importa.</span><nav aria-label="Links de rodapé"><a href="cliente/Termos%20de%20Uso.html">Termos</a><a href="cliente/duvidas.html">Ajuda</a><a href="cliente/contato%20suporte.html">Contato</a></nav><small>© 2026 Agendly · Seu tempo, do seu jeito.</small></footer>
    <script src="js/p4-interactions.js"></script>
    <script>
      document.getElementById('reset-form').addEventListener('submit', async function (event) {
        event.preventDefault();
        const status = document.getElementById('reset-status');
        const password = document.getElementById('new-password').value;
        if (password !== document.getElementById('confirm-password').value) { status.textContent = 'As senhas precisam ser iguais.'; return; }
        if (!window.AgendlyApi.enabled) { status.textContent = 'Abra esta página pelo servidor Agendly para redefinir a senha.'; return; }
        const button = this.querySelector('button[type="submit"]'); button.disabled = true;
        try {
          await window.AgendlyApi.request('reset-password','POST',{token:new URLSearchParams(location.search).get('token'),senha:password});
          status.textContent = 'Senha alterada. Você já pode entrar com a nova senha.';
          window.setTimeout(function(){ location.href='cliente/logincliente.html'; },1400);
        } catch (error) { status.textContent = error.message; }
        finally { button.disabled = false; }
      });
    </script>
  </body>
</html>
